  status: "live"
  home_card: true
  target_date: ""

- title: "When the Network Goes Dark"
  url: "/analysis/when-the-network-goes-dark/"
  question: "Can you trust the number?"
  what: "Full study and open dataset: 22 storms and 174 FCC reports, checked line by line, released with a DOI."
  summary: "Cell-site outages and recovery in 22 Gulf and Southeast hurricanes, 2017–2026: half the sites out at the peak were back within a median of 2 days, only 6 to 11 of 20 storms with a report after their peak reach 90% before the FCC's reports end, county-reports with more electricity customers without power tend to have more cell sites out, and in all 22 storms the FCC's last public report still showed cell sites out: 1,887 in total."
  methods:
    - "Parsing and validating FCC DIRS reports"
    - "County-bootstrap intervals"
    - "Calibrated exposure model"
    - "Discrete-time hazard with censoring"
  markers:
    - "Open dataset"
    - "DOI"
    - "Reproducible code"
    - "Datasheet"
  data_note: "Public data: FCC DIRS reports, ORNL/DOE EAGLE-I, NOAA NHC, CDC/ATSDR SVI, OpenFEMA and Census."
  status: "live"
  featured: true
  home_card: true
  target_date: ""

- title: "Did Medicaid expansion reduce uninsurance among low-income adults?"
  url: "/analysis/medicaid-expansion-uninsured/"
  question: "Did it work?"
  what: "Focused analysis: one policy question, one design (staggered difference-in-differences) on Census data for the 50 states and DC, 2009–2019."
  summary: "A staggered difference-in-differences analysis of state Medicaid expansions and the uninsured rate among adults under 138% of the poverty line, with a committed analysis plan, robustness checks and sensitivity bounds."
  methods:
    - "Difference-in-differences with staggered timing"
    - "Callaway–Sant'Anna estimator"
    - "HonestDiD sensitivity bounds"
  markers:
    - "Reproducible code"
  data_note: "Public data: Census American Community Survey microdata and KFF expansion dates."
  status: "live"
  home_card: true
  target_date: ""

- title: "Who files the most severe-injury reports? It depends on how you count employers"
  url: "/analysis/osha-severe-injury-reports-audit/"
  question: "Can you trust the number?"
  what: "Data audit: one federal file, {raw_names} employer names reduced step by step to {final_employers} employers, with the matcher's accuracy measured on {labeled_pairs} labeled pairs."
  what_numbers: "demos/results/osha_audit.json"  # filled in by build.py from the audit's output
