# Worked examples for /work/. The Work page states once that these are demonstrations on public data, not client
# work; the home page's featured example carries a short form of that label.
#
# status: live         — finished and published; may be featured on the home page
# status: in_progress  — listed under "In progress", never presented as finished;
#                        target_date is hidden while it is TODO
# question must match a `question` in services.yaml exactly.
# what:      what the piece is, in a manager's words, with its scale; every fact from the example's own page or results
# markers:   only what is true of the example, from: Open dataset, DOI, Reproducible code, Datasheet
# featured:  the home page's worked example (exactly one)
# home_card: the example the home page's question card links to (one per question)
# Any non-draft page in content/analysis/ joins /work/ automatically.

- title: "Who Leaves, Who to Save, and What It Costs"
