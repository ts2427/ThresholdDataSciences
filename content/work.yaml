- title: "When the Network Goes Dark"
  url: "/analysis/when-the-network-goes-dark/"
  question: "Did it work?"
  summary: "Cell-site outages and recovery in 21 Gulf and Southeast hurricanes, 2017–2026: half the sites out at the peak were back within a median of 2 days, only 6 to 11 of 20 storms with a report after their peak reach 90% before the FCC's reports end, and cell outages tend to rise and fall with power outages. Version 2 adds that in all 21 storms the FCC's last public report still showed cell sites out: 1,883 in total."
  methods:
    - "Parsing and validating FCC DIRS reports"
    - "County-bootstrap intervals"
    - "Calibrated exposure model"
    - "Discrete-time hazard with censoring"
  data_note: "Public data: FCC DIRS reports, ORNL/DOE EAGLE-I, NOAA NHC, CDC/ATSDR SVI, OpenFEMA and Census."
  status: "live"
  target_date: ""

