{# The step-function rule — the site's structural device. A horizontal line
   that steps up at a marked point; the riser carries the Signal color. #}
<div class="step-rule" role="presentation" aria-hidden="true">
  <svg viewBox="0 0 100 14" preserveAspectRatio="none" focusable="false">
    <path d="M0 13 H62" class="step-low" vector-effect="non-scaling-stroke"/>
    <path d="M62 13 V1" class="step-riser" vector-effect="non-scaling-stroke"/>
    <path d="M62 1 H100" class="step-high" vector-effect="non-scaling-stroke"/>
  </svg>
</div>
