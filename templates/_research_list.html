<ul class="research-list">
  {% for r in research %}
  <li class="research-item">
    <span class="research-year"><time datetime="{{ r.year }}">{{ r.year }}</time></span>
    <div>
      <p class="research-title">{% if r.url %}<a href="{{ r.url }}">{{ r.title }}</a>{% else %}{{ r.title }}{% endif %}</p>
      <p class="research-venue">{{ r.venue }}</p>
      <p class="research-desc">{{ r.description }}</p>
    </div>
  </li>
  {% endfor %}
</ul>
