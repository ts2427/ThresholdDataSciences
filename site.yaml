# Global site configuration. Edit here, rerun `python build.py`.

name: "Threshold Data Sciences"
base_url: "https://thresholddatasciences.com"
description: >-
  Threshold Data Sciences is the independent analytics practice of Timothy D.
  Spivey. It answers three questions behind hard decisions — did it work, can
  you trust the number, what happens next — with research-grade methods and
  fixed-scope engagements.
series_description: >-
  Threshold Effects — a numbered research series from Threshold Data Sciences
  on regulation, disclosure, governance, and the organizational capacity that
  decides outcomes.

author:
  name: "Timothy D. Spivey"
  citation_name: "Spivey, T. D."   # used in the generated citation blocks
  job_title: "Founder, Threshold Data Sciences"
  # knowsAbout feeds the JSON-LD Person schema: methods only.
  knows_about:
    - "Event study methodology"
    - "Causal inference"
    - "Applied econometrics"
    - "Research design"
    - "Measurement and validity"
    - "Data engineering"
    - "Panel data analysis"
    - "Survival analysis"
    - "Predictive modeling"
    - "Customer retention analytics"
    - "Data quality auditing"
    - "Business analytics"
    - "Telecommunications operations"
  # sameAs identity links for JSON-LD Person schema.
  linkedin: "https://www.linkedin.com/in/tispivey/"
  scholar: "https://scholar.google.com/citations?user=S9sSV1EAAAAJ&hl=en"
  orcid: "https://orcid.org/0009-0009-8990-4308"
  personal_site: "https://timothydspivey.com"

# THE site email. Single source of truth: shown on the contact page,
# included in the JSON-LD Organization schema.
contact_email: "timothy@thresholddatasciences.com"

# Contact box delivery. The form posts to FormSubmit, which relays the
# submission to the address in this URL. NOTE: FormSubmit requires a
# one-time activation — after the first submission, click the link in the
# activation email that arrives in this inbox, or nothing is delivered.
contact_form_action: "https://formsubmit.co/timothy@thresholddatasciences.com"


# ------------------------------------------------------------ the practice --

