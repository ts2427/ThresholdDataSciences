# Shown beside the contact form: "You'll hear back within {response_time}."
response_time: "two business days"

# Shown in the home hero, on /about/ and in the footer. Change to the
# registered LLC name only once Sunbiz shows it active.
legal_line: "Threshold Data Sciences is the independent practice of Timothy D. Spivey, Pensacola, Florida."

# Path to a headshot (e.g. "/static/img/headshot.jpg"). Empty = no image.
